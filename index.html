<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Marino Family Recipe Collection — treasured recipes from our kitchen to yours." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Marino Recipes" />
  <meta name="application-name" content="Marino Recipes" />
  <title>Marino Family Recipes</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #142018;
      --ink-soft: #3a4740;
      --muted: #67756c;
      --brand: #183024;
      --leaf: #4d6a52;
      --gold: #c4a35a;
      --gold-soft: #e0c789;
      --paper: #f4f2ec;
      --line: rgba(20, 32, 24, 0.12);
      --danger: #9a3f2f;
      --shadow: 0 22px 60px rgba(12, 22, 16, 0.16);
      --nav-h: 64px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Figtree", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(900px 480px at 85% -5%, rgba(196, 163, 90, 0.16), transparent 55%),
        radial-gradient(1000px 520px at -5% 0%, rgba(77, 106, 82, 0.18), transparent 50%),
        linear-gradient(180deg, #e4ebe4 0%, var(--paper) 40%, #efeae1 100%);
      background-attachment: fixed;
      min-height: 100dvh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    button, input { font: inherit; }
    button { cursor: pointer; border: 0; background: none; color: inherit; }

    .app { min-height: 100dvh; display: flex; flex-direction: column; }

    .topbar {
      position: sticky; top: 0; z-index: 40;
      height: var(--nav-h);
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0 1rem; padding-top: env(safe-area-inset-top, 0);
      background: rgba(244, 242, 236, 0.78);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid transparent;
      transition: border-color .25s, box-shadow .25s;
    }
    .topbar.scrolled {
      border-color: var(--line);
      box-shadow: 0 10px 28px rgba(12, 22, 16, 0.07);
    }
    .topbar-brand {
      font-family: var(--font-display);
      font-weight: 700; font-size: 1.15rem;
      color: var(--brand); white-space: nowrap;
    }
    .topbar-brand span { color: var(--gold); font-weight: 500; }
    .search-wrap { flex: 1; max-width: 420px; margin-left: auto; position: relative; }
    .search-wrap input {
      width: 100%; border: 1px solid var(--line);
      background: rgba(255,255,255,.72); border-radius: 999px;
      padding: .65rem 1rem .65rem 2.4rem; outline: none;
    }
    .search-wrap input:focus {
      border-color: var(--leaf);
      box-shadow: 0 0 0 3px rgba(77, 106, 82, 0.18);
    }
    .search-wrap svg {
      position: absolute; left: .85rem; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; opacity: .55; pointer-events: none;
    }
    .fav-toggle {
      width: 42px; height: 42px; border-radius: 50%;
      display: grid; place-items: center;
      border: 1px solid var(--line); background: rgba(255,255,255,.65); flex-shrink: 0;
    }
    .fav-toggle[aria-pressed="true"] {
      background: var(--brand); color: var(--paper); border-color: var(--brand);
    }

    main { flex: 1; width: min(1180px, 100%); margin: 0 auto; padding: 0 1rem 5.5rem; }
    .view { display: none; animation: fadeUp .45s ease both; }
    .view.active { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes ken {
      from { transform: scale(1.05); }
      to { transform: scale(1); }
    }

    .hero {
      position: relative;
      min-height: min(88dvh, 780px);
      margin: .75rem 0 2.25rem;
      border-radius: 28px;
      overflow: hidden;
      color: #f7f4ee;
      display: grid;
      align-items: end;
      isolation: isolate;
      box-shadow: var(--shadow);
    }
    .hero-media {
      position: absolute; inset: 0; z-index: -2;
    }
    .hero-media img {
      width: 100%; height: 100%; object-fit: cover;
      animation: ken 18s ease-out both;
    }
    .hero::after {
      content: "";
      position: absolute; inset: 0; z-index: -1;
      background:
        linear-gradient(90deg, rgba(10, 18, 14, 0.82) 0%, rgba(10, 18, 14, 0.45) 55%, rgba(10, 18, 14, 0.25) 100%),
        linear-gradient(180deg, rgba(10, 18, 14, 0.15) 0%, rgba(10, 18, 14, 0.78) 100%);
    }
    .hero-inner {
      padding: clamp(1.5rem, 5vw, 3.5rem);
      max-width: 34rem;
    }
    .hero-year {
      display: inline-block;
      font-size: .78rem; letter-spacing: .22em; text-transform: uppercase;
      color: var(--gold-soft); margin-bottom: .85rem;
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(3.2rem, 12vw, 6.2rem);
      line-height: .92; margin: 0 0 .6rem; font-weight: 700;
    }
    .hero h1 em {
      font-style: italic; font-weight: 500; color: var(--gold-soft);
      display: block; font-size: .42em; letter-spacing: .08em; margin-top: .35em;
    }
    .hero p {
      margin: 0 0 1.5rem; color: rgba(247, 244, 238, .88);
      font-size: 1.05rem; max-width: 30ch;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: .7rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
      padding: .85rem 1.25rem; border-radius: 999px; font-weight: 600;
      transition: transform .2s, background .2s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--gold); color: #1a1608; }
    .btn-primary:hover { background: var(--gold-soft); }
    .btn-ghost {
      background: rgba(255,255,255,.12); color: #f7f4ee;
      border: 1px solid rgba(255,255,255,.28);
    }

    .section-head {
      display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin: 0 0 1rem;
    }
    .section-head h2 {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      margin: 0; color: var(--brand); line-height: 1.15;
    }
    .section-head p { margin: .25rem 0 0; color: var(--muted); font-size: .95rem; }

    .cat-rail {
      display: grid; grid-auto-flow: column; grid-auto-columns: minmax(180px, 1fr);
      gap: .85rem; overflow-x: auto; padding: .25rem 0 1.35rem;
      scroll-snap-type: x mandatory; scrollbar-width: none;
    }
    .cat-rail::-webkit-scrollbar { display: none; }
    .cat-chip {
      scroll-snap-align: start;
      position: relative; overflow: hidden;
      text-align: left; min-height: 148px; border-radius: 20px;
      color: #f7f4ee; isolation: isolate;
      transition: transform .22s, box-shadow .22s;
    }
    .cat-chip img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: -2; transition: transform .5s;
    }
    .cat-chip::after {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(180deg, rgba(8,14,10,.15), rgba(8,14,10,.82));
    }
    .cat-chip:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(12,22,16,.18); }
    .cat-chip:hover img { transform: scale(1.06); }
    .cat-chip .cat-copy {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 1rem 1.05rem; display: grid; gap: .2rem;
    }
    .cat-chip strong {
      font-family: var(--font-display); font-size: 1.15rem; line-height: 1.15;
    }
    .cat-chip span { font-size: .8rem; opacity: .88; }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr));
      gap: 1rem;
    }
    .recipe-card {
      text-align: left; border-radius: 22px; overflow: hidden;
      background: rgba(255,255,255,.7); border: 1px solid var(--line);
      display: flex; flex-direction: column;
      transition: transform .22s, box-shadow .22s;
      position: relative;
    }
    .recipe-card:hover, .recipe-card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(12, 22, 16, .14);
    }
    .recipe-card .thumb {
      aspect-ratio: 4 / 3; overflow: hidden; background: #d7ddd7;
    }
    .recipe-card .thumb img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .55s ease;
    }
    .recipe-card:hover .thumb img { transform: scale(1.05); }
    .recipe-card .body { padding: 1rem 1.05rem 1.15rem; display: grid; gap: .4rem; flex: 1; }
    .recipe-card .cat-tag {
      font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
      color: var(--leaf); font-weight: 600;
    }
    .recipe-card h3 {
      font-family: var(--font-display); font-size: 1.28rem;
      margin: 0; line-height: 1.2; color: var(--brand);
    }
    .recipe-card .meta { margin-top: auto; font-size: .88rem; color: var(--muted); }
    .heart {
      position: absolute; top: .75rem; right: .75rem; z-index: 2;
      width: 36px; height: 36px; border-radius: 50%;
      display: grid; place-items: center; color: var(--muted);
      background: rgba(255,255,255,.9); border: 1px solid rgba(255,255,255,.5);
      backdrop-filter: blur(6px);
    }
    .heart.on { color: var(--danger); }

    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }

    .detail-back {
      display: inline-flex; align-items: center; gap: .4rem;
      margin: 1rem 0 1rem; color: var(--leaf); font-weight: 600;
    }
    .detail-hero {
      position: relative; border-radius: 28px; overflow: hidden;
      min-height: min(62dvh, 560px); color: #f7f4ee;
      margin-bottom: 1.5rem; box-shadow: var(--shadow);
      display: grid; align-items: end; isolation: isolate;
    }
    .detail-hero img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: -2; animation: ken 14s ease-out both;
    }
    .detail-hero::after {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(180deg, rgba(8,14,10,.05) 20%, rgba(8,14,10,.88) 100%);
    }
    .detail-hero .content { padding: clamp(1.3rem, 4vw, 2.4rem); max-width: 40rem; }
    .detail-hero .cat-tag {
      color: var(--gold-soft); letter-spacing: .12em; text-transform: uppercase;
      font-size: .75rem; font-weight: 600;
    }
    .detail-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2.1rem, 7vw, 3.5rem);
      margin: .4rem 0 .5rem; line-height: 1.05;
    }
    .detail-hero .from { opacity: .88; margin-bottom: 1rem; }
    .timing { display: flex; flex-wrap: wrap; gap: .5rem; }
    .timing span {
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px; padding: .35rem .75rem; font-size: .85rem;
    }
    .detail-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.15rem; }
    .detail-actions .btn {
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: #f7f4ee;
    }
    .detail-actions .btn.on { background: var(--gold); color: #1a1608; border-color: var(--gold); }

    .fact {
      margin: 0 0 1.5rem; padding: 1.1rem 1.2rem;
      border-left: 3px solid var(--gold);
      background: rgba(255,255,255,.58); border-radius: 0 16px 16px 0; color: var(--ink-soft);
    }
    .fact strong {
      display: block; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--gold); margin-bottom: .35rem;
    }

    .detail-layout { display: grid; gap: 1.5rem; }
    @media (min-width: 820px) {
      .detail-layout { grid-template-columns: .95fr 1.15fr; align-items: start; }
    }
    .panel {
      background: rgba(255,255,255,.62); border: 1px solid var(--line);
      border-radius: 22px; padding: 1.25rem 1.3rem 1.4rem;
    }
    .panel h2 {
      font-family: var(--font-display); font-size: 1.35rem;
      margin: 0 0 .9rem; color: var(--brand);
    }
    .ingredients { list-style: none; padding: 0; margin: 0; display: grid; gap: .55rem; }
    .ingredients li {
      display: grid; grid-template-columns: 22px 1fr; gap: .55rem; align-items: start;
      padding-bottom: .55rem; border-bottom: 1px dashed var(--line);
    }
    .ingredients li:last-child { border-bottom: 0; padding-bottom: 0; }
    .ingredients input { margin-top: .2rem; accent-color: var(--leaf); width: 16px; height: 16px; }
    .ingredients input:checked + label { text-decoration: line-through; color: var(--muted); }
    .steps { margin: 0; padding-left: 1.2rem; display: grid; gap: .85rem; }
    .steps li::marker { color: var(--leaf); font-weight: 700; font-family: var(--font-display); }
    .note {
      margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line);
      color: var(--ink-soft); font-size: .95rem;
    }
    .note strong { color: var(--brand); }

    .bottom-nav {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(.75rem + var(--safe-b)); z-index: 50;
      display: flex; gap: .35rem; padding: .4rem;
      background: rgba(24, 48, 36, .93); color: #f7f4ee;
      border-radius: 999px; box-shadow: 0 12px 40px rgba(8, 18, 12, .38);
      backdrop-filter: blur(10px); width: min(420px, calc(100% - 1.5rem));
    }
    .bottom-nav button {
      flex: 1; border-radius: 999px; padding: .7rem .4rem;
      font-size: .78rem; font-weight: 600; opacity: .7;
      display: grid; gap: .15rem; justify-items: center;
    }
    .bottom-nav button svg { width: 18px; height: 18px; }
    .bottom-nav button.active { opacity: 1; background: rgba(255,255,255,.12); }

    @media (min-width: 980px) {
      .bottom-nav { display: none; }
      main { padding-bottom: 3rem; }
    }
    @media (max-width: 640px) {
      .search-wrap { max-width: none; }
      .topbar-brand .full { display: none; }
      .hero { min-height: min(78dvh, 640px); border-radius: 20px; }
      .detail-hero { border-radius: 20px; min-height: min(54dvh, 420px); }
    }
    .install-btn {
      display: none;
      align-items: center;
      gap: .35rem;
      white-space: nowrap;
      padding: .55rem .9rem;
      border-radius: 999px;
      background: #000;
      color: #fff;
      font-size: .82rem;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,.12);
      flex-shrink: 0;
    }
    .install-btn.show { display: inline-flex; }
    .install-btn .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #e23b2f;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.15);
      position: relative;
    }
    .install-btn .dot::after {
      content: "M";
      position: absolute; inset: 0;
      display: grid; place-items: center;
      font-size: 8px; font-weight: 800; color: #fff; line-height: 1;
    }

    @media print {
      .topbar, .bottom-nav, .detail-back, .detail-actions, .heart, .fav-toggle, .install-btn { display: none !important; }
      body { background: white; }
      .detail-hero { min-height: 240px; box-shadow: none; }
      .panel { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar">
      <button class="topbar-brand" id="brandHome" type="button" aria-label="Home">
        Marino <span class="full">Family Recipes</span>
      </button>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input id="search" type="search" placeholder="Search recipes, ingredients…" autocomplete="off" enterkeyhint="search" />
      </div>
      <button class="install-btn" id="installBtn" type="button" title="Install app">
        <span class="dot" aria-hidden="true"></span>
        Install
      </button>
      <button class="fav-toggle" id="favFilter" type="button" aria-pressed="false" title="Show favorites" aria-label="Show favorites">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 21s-6.7-4.35-9.33-8.1C.8 10.2 1.2 6.8 3.9 5.2 6.1 3.9 8.7 4.5 10.2 6.3L12 8.4l1.8-2.1c1.5-1.8 4.1-2.4 6.3-1.1 2.7 1.6 3.1 5 1.23 7.7C18.7 16.65 12 21 12 21z"/>
        </svg>
      </button>
    </header>

    <main>
      <section class="view active" id="view-home" aria-label="Home"></section>
      <section class="view" id="view-browse" aria-label="Browse"></section>
      <section class="view" id="view-recipe" aria-label="Recipe"></section>
    </main>

    <nav class="bottom-nav" aria-label="Primary">
      <button type="button" data-nav="home" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>
        Home
      </button>
      <button type="button" data-nav="browse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Browse
      </button>
      <button type="button" data-nav="favorites">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.35-9.33-8.1C.8 10.2 1.2 6.8 3.9 5.2 6.1 3.9 8.7 4.5 10.2 6.3L12 8.4l1.8-2.1c1.5-1.8 4.1-2.4 6.3-1.1 2.7 1.6 3.1 5 1.23 7.7C18.7 16.65 12 21 12 21z"/></svg>
        Saved
      </button>
    </nav>
  </div>

  <script>
    const CATEGORIES = [
      { id: "breakfast", name: "Breakfast & Breads", blurb: "Welcome the morning", short: "Breakfast", image: "media/cat-breakfast.jpg" },
      { id: "soups", name: "Soups, Salads & Sandwiches", blurb: "It's noon… time to eat", short: "Lunch", image: "media/cat-soups.jpg" },
      { id: "appetizers", name: "Appetizers", blurb: "From unique treats to spicy eats", short: "Apps", image: "media/cat-appetizers.jpg" },
      { id: "dinner", name: "Dinner Entrees & Sides", blurb: "The heart of the table", short: "Dinner", image: "media/cat-dinner.jpg" },
      { id: "desserts", name: "Desserts", blurb: "Sweet sensations", short: "Sweets", image: "media/cat-desserts.jpg" },
      { id: "cocktails", name: "Cocktails", blurb: "Double the pleasure", short: "Drinks", image: "media/cat-cocktails.jpg" }
    ];

    const RECIPES = [
      {
        "id": "breakfast-bake",
        "category": "breakfast",
        "title": "Breakfast Bake",
        "from": "Shelley Mackey",
        "by": "Lillian Marino",
        "prep": "15 minutes",
        "cook": "1 hour",
        "image": "media/breakfast-bake.jpg",
        "ingredients": [
          "½ loaf brioche bread, cubed",
          "6 eggs",
          "1 lb breakfast sausage",
          "1 cup half & half (or 1 cup milk)",
          "6 oz shredded cheese",
          "1 teaspoon ground mustard",
          "1 teaspoon salt"
        ],
        "steps": [
          "Cube bread and layer over the bottom of greased 9 x 12 in baking pan.",
          "Brown sausage and drain. Pour over cubed bread and add a layer of shredded cheese.",
          "In a separate bowl, mix together eggs, milk, ground mustard, and salt.",
          "Pour mixture over the top of bread & cheese, cover and let sit overnight in refrigerator.",
          "When ready to bake, place foil over the top and bake at 350°F for 50 to 60 minutes. Let sit 15 minutes prior to serving."
        ]
      },
      {
        "id": "banana-bread",
        "category": "breakfast",
        "title": "Banana Bread",
        "from": "Rita Marino",
        "prep": "15 minutes",
        "cook": "1 hour",
        "image": "media/banana-bread.jpg",
        "fact": "Growing up we had one cookbook “Betty Crocker”. Banana Bread was one of my favorite recipes I made throughout my lifetime.",
        "ingredients": [
          "½ cup unsalted butter, melted and cool",
          "1¼ cup granulated sugar",
          "1 teaspoon vanilla extract",
          "1 teaspoon salt",
          "2 large eggs",
          "½ cup buttermilk",
          "1 teaspoon baking soda",
          "2½ cups all-purpose flour",
          "4 ripe bananas"
        ],
        "steps": [
          "Preheat oven to 350°F. Set oven rack to low position so tops of pans will be in center of oven. Grease bottoms only of 2 loaf pans 8½″ × 4½″ × 2½″ or 1 loaf pan, 9×5×3 inches.",
          "In a large bowl mix together butter and sugar until light and creamy. Add eggs and blend.",
          "Mash bananas with a fork in a separate bowl and blend into egg mixture. Add buttermilk and vanilla and mix well.",
          "Fold in the dry ingredients until everything is mixed together.",
          "Pour into prepared pan and bake 50 minutes; 9-inch loaf 1 hour. Test with toothpick — it should come out clean.",
          "Cool 10 minutes before removing from pan. Place on wire rack, top side up, and cool completely, about 2 hours before slicing.",

        ],
        "steps": [
          "Combine rum, Grand Marnier, orgeat syrup, and lime juice.",
          "Shake or stir with ice and serve.",
          "Garnish as desired."
        ],
        "notes": "Amounts as preferred — signature wedding bar pour."
      },
      {
        "id": "frozen-margarita",
        "category": "cocktails",
        "title": "Frozen Margarita",
        "from": "Cheri Marino",
        "by": "Rita Marino",
        "prep": "10 minutes",
        "image": "media/frozen-margarita.jpg",
        "fact": "My favorite frozen margaritas are made at Los Barrios Restaurant here in San Antonio. When making them at home, Cheri Marino uses this recipe most like Los Barrios frozen margaritas.",
        "ingredients": [
          "6 ounces tequila",
          "1 ounce Grand Marnier",
          "1 (12-ounce) can frozen lime juice",
          "3 scoops crushed ice",
          "Blender"
        ],
        "steps": [
          "Add ice to blender.",
          "Pour frozen lime juice over ice in blender. Add 6 ounces tequila and blend for 30 seconds or desired consistency.",
          "Pour into drinking glasses and top with 1 ounce Grand Marnier.",
          "Garnish with lime slice."
        ]
      }
    ];
    const FAV_KEY = "marino-favs-v1";
    const state = {
      view: "home",
      category: null,
      recipeId: null,
      query: "",
      favOnly: false,
      favorites: new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]"))
    };

    const $ = (sel, el = document) => el.querySelector(sel);
    const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];

    function catById(id) { return CATEGORIES.find(c => c.id === id); }
    function saveFavs() { localStorage.setItem(FAV_KEY, JSON.stringify([...state.favorites])); }

    function toggleFav(id, ev) {
      if (ev) ev.stopPropagation();
      if (state.favorites.has(id)) state.favorites.delete(id);
      else state.favorites.add(id);
      saveFavs();
      render();
    }

    function filteredRecipes() {
      const q = state.query.trim().toLowerCase();
      return RECIPES.filter(r => {
        if (state.favOnly && !state.favorites.has(r.id)) return false;
        if (state.category && r.category !== state.category) return false;
        if (!q) return true;
        const hay = [r.title, r.from, r.fact || "", ...(r.ingredients || []), ...(r.steps || []), r.notes || ""].join(" ").toLowerCase();
        return hay.includes(q);
      });
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function recipeCard(r) {
      const cat = catById(r.category);
      const on = state.favorites.has(r.id);
      return `
        <article class="recipe-card" role="button" tabindex="0" data-open="${r.id}">
          <button class="heart ${on ? "on" : ""}" type="button" aria-label="${on ? "Remove from saved" : "Save recipe"}" data-fav="${r.id}">♥</button>
          <div class="thumb"><img src="${escapeHtml(r.image)}" alt="" loading="lazy" /></div>
          <div class="body">
            <div class="cat-tag">${cat?.short || ""}</div>
            <h3>${escapeHtml(r.title)}</h3>
            <div class="meta">From ${escapeHtml(r.from)}${r.prep ? ` · ${escapeHtml(r.prep)}` : ""}</div>
          </div>
        </article>`;
    }

    function renderHome() {
      const featured = ["breakfast-bake", "spaghetti-meatballs", "barbeque-ribs", "bob-armstrong-dip", "sugar-cookies", "hawaiian-mai-tai"]
        .map(id => RECIPES.find(r => r.id === id)).filter(Boolean);
      const list = state.query || state.favOnly ? filteredRecipes() : featured;
      const heading = state.favOnly
        ? { title: "Saved recipes", sub: "Your kitchen shortlist" }
        : state.query
          ? { title: "Search results", sub: `${filteredRecipes().length} match${filteredRecipes().length === 1 ? "" : "es"}` }
          : { title: "Family favorites", sub: "Start with a classic from the collection" };

      $("#view-home").innerHTML = `
        ${!state.query && !state.favOnly ? `
        <section class="hero" aria-label="Marino Family Recipes">
          <div class="hero-media"><img src="media/cover.jpg" alt="Marino family recipe collection" /></div>
          <div class="hero-inner">
            <div class="hero-year">Collection · 2021</div>
            <h1>Marino<em>Family Recipes</em></h1>
            <p>Treasured dishes passed across tables, kitchens, and generations.</p>
            <div class="hero-actions">
              <button class="btn btn-primary" type="button" data-nav="browse">Browse the book</button>
              <button class="btn btn-ghost" type="button" data-open="spaghetti-meatballs">Open Sunday sauce</button>
            </div>
          </div>
        </section>
        <div class="section-head">
          <div>
            <h2>Chapters</h2>
            <p>Six sections from breakfast through cocktails</p>
          </div>
        </div>
        <div class="cat-rail" role="list">
          ${CATEGORIES.map(c => {
            const count = RECIPES.filter(r => r.category === c.id).length;
            return `<button class="cat-chip" type="button" role="listitem" data-cat="${c.id}">
              <img src="${escapeHtml(c.image)}" alt="" loading="lazy" />
              <div class="cat-copy">
                <strong>${escapeHtml(c.name)}</strong>
                <span>${count} recipes · ${escapeHtml(c.blurb)}</span>
              </div>
            </button>`;
          }).join("")}
        </div>` : ""}
        <div class="section-head">
          <div>
            <h2>${escapeHtml(heading.title)}</h2>
            <p>${escapeHtml(heading.sub)}</p>
          </div>
        </div>
        <div class="recipe-grid">
          ${list.length ? list.map(recipeCard).join("") : `<div class="empty">No recipes match. Try another search.</div>`}
        </div>
        ${!state.query && !state.favOnly ? `
        <div class="section-head" style="margin-top:2.5rem">
          <div>
            <h2>All ${RECIPES.length} recipes</h2>
            <p>Every page from the Marino Family Recipe Collection</p>
          </div>
        </div>
        <div class="recipe-grid">${RECIPES.map(recipeCard).join("")}</div>` : ""}
      `;
    }

    function renderBrowse() {
      const recipes = filteredRecipes();
      const cat = state.category ? catById(state.category) : null;
      $("#view-browse").innerHTML = `
        <div class="section-head" style="margin-top:1.25rem">
          <div>
            <h2>${escapeHtml(cat ? cat.name : "Browse recipes")}</h2>
            <p>${escapeHtml(cat ? cat.blurb : `${RECIPES.length} recipes across six chapters`)}</p>
          </div>
          ${state.category ? `<button class="btn" type="button" data-cat="" style="border:1px solid var(--line);border-radius:999px;padding:.55rem 1rem;background:#fff">All chapters</button>` : ""}
        </div>
        <div class="cat-rail" role="list">
          ${CATEGORIES.map(c => {
            const active = state.category === c.id;
            const count = RECIPES.filter(r => r.category === c.id).length;
            return `<button class="cat-chip" type="button" role="listitem" data-cat="${c.id}" style="${active ? "outline:2px solid var(--gold);outline-offset:2px" : ""}">
              <img src="${escapeHtml(c.image)}" alt="" loading="lazy" />
              <div class="cat-copy">
                <strong>${escapeHtml(c.short)}</strong>
                <span>${count} recipes</span>
              </div>
            </button>`;
          }).join("")}
        </div>
        <div class="recipe-grid">
          ${recipes.length ? recipes.map(recipeCard).join("") : `<div class="empty">No recipes in this view.</div>`}
        </div>
      `;
    }

    function renderRecipe() {
      const r = RECIPES.find(x => x.id === state.recipeId);
      if (!r) { state.view = "home"; render(); return; }
      const cat = catById(r.category);
      const on = state.favorites.has(r.id);
      const timing = [r.prep && `Prep ${r.prep}`, r.cook && `Cook ${r.cook}`, r.serves && `Serves ${r.serves}`].filter(Boolean);

      $("#view-recipe").innerHTML = `
        <button class="detail-back" type="button" data-back>← Back</button>
        <header class="detail-hero">
          <img src="${escapeHtml(r.image)}" alt="${escapeHtml(r.title)}" />
          <div class="content">
            <div class="cat-tag">${escapeHtml(cat?.name || "")}</div>
            <h1>${escapeHtml(r.title)}</h1>
            <div class="from">${r.by ? `By ${escapeHtml(r.by)} · ` : ""}Recipe from ${escapeHtml(r.from)}</div>
            ${timing.length ? `<div class="timing">${timing.map(t => `<span>${escapeHtml(t)}</span>`).join("")}</div>` : ""}
            <div class="detail-actions">
              <button class="btn ${on ? "on" : ""}" type="button" data-fav="${r.id}">${on ? "Saved ♥" : "Save recipe"}</button>
              <button class="btn" type="button" onclick="window.print()">Print</button>
            </div>
          </div>
        </header>
        ${r.fact ? `<aside class="fact"><strong>Fun fact</strong>${escapeHtml(r.fact)}</aside>` : ""}
        <div class="detail-layout">
          <section class="panel">
            <h2>Ingredients</h2>
            <ul class="ingredients">
              ${r.ingredients.map((ing, i) => `
                <li>
                  <input type="checkbox" id="ing-${i}" />
                  <label for="ing-${i}">${escapeHtml(ing)}</label>
                </li>`).join("")}
            </ul>
          </section>
          <section class="panel">
            <h2>Directions</h2>
            <ol class="steps">
              ${r.steps.map(s => `<li>${escapeHtml(s)}</li>`).join("")}
            </ol>
            ${r.notes ? `<div class="note"><strong>Cook’s note.</strong> ${escapeHtml(r.notes)}</div>` : ""}
          </section>
        </div>
      `;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setView(view) {
      state.view = view;
      $$(".view").forEach(v => v.classList.toggle("active", v.id === `view-${view}`));
      $$(".bottom-nav button").forEach(b => {
        const nav = b.dataset.nav;
        const active =
          (nav === "home" && view === "home" && !state.favOnly) ||
          (nav === "browse" && view === "browse") ||
          (nav === "favorites" && state.favOnly && view === "home");
        b.classList.toggle("active", active);
      });
    }

    function render() {
      $("#favFilter").setAttribute("aria-pressed", state.favOnly ? "true" : "false");
      if (state.view === "home") renderHome();
      else if (state.view === "browse") renderBrowse();
      else if (state.view === "recipe") renderRecipe();
      setView(state.view);
      bindDynamic();
    }

    function openRecipe(id) {
      state.recipeId = id;
      state.view = "recipe";
      render();
      history.pushState({ view: "recipe", id }, "", `#recipe/${id}`);
    }

    function goHome() {
      state.view = "home";
      state.category = null;
      state.recipeId = null;
      if (!state.favOnly) history.pushState({ view: "home" }, "", "#");
      render();
    }

    function goBrowse(catId = null) {
      state.view = "browse";
      state.category = catId || null;
      state.favOnly = false;
      state.recipeId = null;
      history.pushState({ view: "browse", category: state.category }, "", state.category ? `#browse/${state.category}` : "#browse");
      render();
    }

    function bindDynamic() {
      $$("[data-open]").forEach(el => {
        const open = () => openRecipe(el.dataset.open);
        el.addEventListener("click", open);
        el.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
        });
      });
      $$("[data-fav]").forEach(el => el.addEventListener("click", e => toggleFav(el.dataset.fav, e)));
      $$("[data-cat]").forEach(el => el.addEventListener("click", () => goBrowse(el.dataset.cat || null)));
      $$("[data-nav]").forEach(el => el.addEventListener("click", () => {
        const nav = el.dataset.nav;
        if (nav === "home") {
          state.favOnly = false; state.query = ""; $("#search").value = ""; goHome();
        } else if (nav === "browse") goBrowse(null);
        else if (nav === "favorites") {
          state.favOnly = true; state.query = ""; $("#search").value = "";
          state.view = "home"; history.pushState({ view: "favorites" }, "", "#saved"); render();
        }
      }));
      const back = $("[data-back]");
      if (back) back.addEventListener("click", () => {
        if (history.length > 1) history.back();
        else goBrowse(state.category);
      });
    }

    $("#search").addEventListener("input", e => {
      state.query = e.target.value;
      if (state.view === "recipe") state.view = state.category ? "browse" : "home";
      render();
    });
    $("#favFilter").addEventListener("click", () => {
      state.favOnly = !state.favOnly;
      if (state.view === "recipe") state.view = "home";
      render();
    });
    $("#brandHome").addEventListener("click", () => {
      state.favOnly = false; state.query = ""; $("#search").value = ""; goHome();
    });
    window.addEventListener("scroll", () => {
      $("#topbar").classList.toggle("scrolled", window.scrollY > 8);
    }, { passive: true });
    window.addEventListener("popstate", () => routeFromHash());

    function routeFromHash() {
      const hash = location.hash.replace(/^#/, "");
      if (hash.startsWith("recipe/")) {
        state.recipeId = hash.slice(7); state.view = "recipe"; state.favOnly = false;
      } else if (hash.startsWith("browse/")) {
        state.category = hash.slice(7) || null; state.view = "browse"; state.favOnly = false;
      } else if (hash === "browse") {
        state.category = null; state.view = "browse"; state.favOnly = false;
      } else if (hash === "saved") {
        state.favOnly = true; state.view = "home";
      } else {
        state.view = "home"; state.category = null; state.favOnly = false;
      }
      render();
    }

    routeFromHash();

    // PWA install + service worker
    let deferredPrompt = null;
    const installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.add("show");
    });
    installBtn.addEventListener("click", async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.classList.remove("show");
        return;
      }
      // iOS / browsers without beforeinstallprompt
      const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      alert(isiOS
        ? "To install: tap Share, then “Add to Home Screen”."
        : "To install: open your browser menu and choose “Install app” or “Add to Home Screen”.");
    });
    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      installBtn.classList.remove("show");
    });
    // Show Install on iOS as guidance even without beforeinstallprompt
    if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone) {
      installBtn.classList.add("show");
    }
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
