<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Marino Family Recipe Collection — treasured recipes from our kitchen to yours." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Marino Recipes" />
  <meta name="application-name" content="Marino Recipes" />
  <title>Marino Family Recipes</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #142018;
      --ink-soft: #3a4740;
      --muted: #67756c;
      --brand: #183024;
      --leaf: #4d6a52;
      --gold: #c4a35a;
      --gold-soft: #e0c789;
      --paper: #f4f2ec;
      --line: rgba(20, 32, 24, 0.12);
      --danger: #9a3f2f;
      --shadow: 0 22px 60px rgba(12, 22, 16, 0.16);
      --nav-h: 64px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Figtree", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(900px 480px at 85% -5%, rgba(196, 163, 90, 0.16), transparent 55%),
        radial-gradient(1000px 520px at -5% 0%, rgba(77, 106, 82, 0.18), transparent 50%),
        linear-gradient(180deg, #e4ebe4 0%, var(--paper) 40%, #efeae1 100%);
      background-attachment: fixed;
      min-height: 100dvh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    button, input { font: inherit; }
    button { cursor: pointer; border: 0; background: none; color: inherit; }

    .app { min-height: 100dvh; display: flex; flex-direction: column; }

    .topbar {
      position: sticky; top: 0; z-index: 40;
      min-height: calc(var(--nav-h) + env(safe-area-inset-top, 0px));
      display: flex; align-items: center; gap: 0.55rem;
      padding: calc(0.45rem + env(safe-area-inset-top, 0px)) 0.85rem 0.45rem;
      background: rgba(244, 242, 236, 0.78);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid transparent;
      transition: border-color .25s, box-shadow .25s;
      overflow: visible;
    }
    .topbar.scrolled {
      border-color: var(--line);
      box-shadow: 0 10px 28px rgba(12, 22, 16, 0.07);
    }
    .topbar-brand {
      font-family: var(--font-display);
      font-weight: 700; font-size: 1.05rem;
      color: var(--brand); white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.1;
    }
    .topbar-brand span { color: var(--gold); font-weight: 500; }
    .search-wrap {
      flex: 1; min-width: 0; max-width: 420px; margin-left: auto;
      position: relative; align-self: center;
    }
    .search-wrap input {
      width: 100%; border: 1px solid var(--line);
      background: rgba(255,255,255,.72); border-radius: 999px;
      padding: .45rem .85rem .45rem 2.15rem; outline: none;
      font-size: .92rem; line-height: 1.25; height: 38px;
      box-sizing: border-box;
    }
    .search-wrap input:focus {
      border-color: var(--leaf);
      box-shadow: 0 0 0 3px rgba(77, 106, 82, 0.18);
    }
    .search-wrap svg {
      position: absolute; left: .75rem; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; opacity: .55; pointer-events: none;
    }
    .cart-toggle {
      position: relative;
      width: 38px; height: 38px; border-radius: 50%;
      display: grid; place-items: center;
      border: 1px solid var(--line); background: rgba(255,255,255,.65); flex-shrink: 0;
      color: var(--brand);
    }
    .cart-toggle.has-items {
      background: var(--brand); color: var(--paper); border-color: var(--brand);
    }
    .cart-toggle .cart-badge {
      position: absolute; top: -3px; right: -3px;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 999px; background: var(--gold); color: #1a1608;
      font-size: .68rem; font-weight: 700; line-height: 18px; text-align: center;
      border: 2px solid var(--paper);
    }
    .cart-toggle .cart-badge:empty { display: none; }

    main { flex: 1; width: min(1180px, 100%); margin: 0 auto; padding: 0 1rem 6.5rem; }
    .view { display: none; animation: fadeUp .45s ease both; }
    .view.active { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes ken {
      from { transform: scale(1.05); }
      to { transform: scale(1); }
    }

    .hero {
      position: relative;
      min-height: min(88dvh, 780px);
      margin: .75rem 0 2.25rem;
      border-radius: 28px;
      overflow: hidden;
      color: #f7f4ee;
      display: grid;
      align-items: end;
      isolation: isolate;
      box-shadow: var(--shadow);
    }
    .hero-media {
      position: absolute; inset: 0; z-index: -2;
    }
    .hero-media img {
      width: 100%; height: 100%; object-fit: cover;
      animation: ken 18s ease-out both;
    }
    .hero::after {
      content: "";
      position: absolute; inset: 0; z-index: -1;
      background:
        linear-gradient(90deg, rgba(10, 18, 14, 0.82) 0%, rgba(10, 18, 14, 0.45) 55%, rgba(10, 18, 14, 0.25) 100%),
        linear-gradient(180deg, rgba(10, 18, 14, 0.15) 0%, rgba(10, 18, 14, 0.78) 100%);
    }
    .hero-inner {
      padding: clamp(1.5rem, 5vw, 3.5rem);
      max-width: 34rem;
    }
    .hero-year {
      display: inline-block;
      font-size: .78rem; letter-spacing: .22em; text-transform: uppercase;
      color: var(--gold-soft); margin-bottom: .85rem;
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(3.2rem, 12vw, 6.2rem);
      line-height: .92; margin: 0 0 .6rem; font-weight: 700;
    }
    .hero h1 em {
      font-style: italic; font-weight: 500; color: var(--gold-soft);
      display: block; font-size: .42em; letter-spacing: .08em; margin-top: .35em;
    }
    .hero p {
      margin: 0 0 1.5rem; color: rgba(247, 244, 238, .88);
      font-size: 1.05rem; max-width: 30ch;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: .7rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
      padding: .85rem 1.25rem; border-radius: 999px; font-weight: 600;
      transition: transform .2s, background .2s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--gold); color: #1a1608; }
    .btn-primary:hover { background: var(--gold-soft); }
    .btn-ghost {
      background: rgba(255,255,255,.12); color: #f7f4ee;
      border: 1px solid rgba(255,255,255,.28);
    }

    .section-head {
      display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin: 0 0 1rem;
    }
    .section-head h2 {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      margin: 0; color: var(--brand); line-height: 1.15;
    }
    .section-head p { margin: .25rem 0 0; color: var(--muted); font-size: .95rem; }

    .cat-rail {
      display: grid; grid-auto-flow: column; grid-auto-columns: minmax(180px, 1fr);
      gap: .85rem; overflow-x: auto; padding: .25rem 0 1.35rem;
      scroll-snap-type: x mandatory; scrollbar-width: none;
    }
    .cat-rail::-webkit-scrollbar { display: none; }
    .cat-chip {
      scroll-snap-align: start;
      position: relative; overflow: hidden;
      text-align: left; min-height: 148px; border-radius: 20px;
      color: #f7f4ee; isolation: isolate;
      transition: transform .22s, box-shadow .22s;
    }
    .cat-chip img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: -2; transition: transform .5s;
    }
    .cat-chip::after {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(180deg, rgba(8,14,10,.15), rgba(8,14,10,.82));
    }
    .cat-chip:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(12,22,16,.18); }
    .cat-chip:hover img { transform: scale(1.06); }
    .cat-chip .cat-copy {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 1rem 1.05rem; display: grid; gap: .2rem;
    }
    .cat-chip strong {
      font-family: var(--font-display); font-size: 1.15rem; line-height: 1.15;
    }
    .cat-chip span { font-size: .8rem; opacity: .88; }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr));
      gap: 1rem;
    }
    .recipe-card {
      text-align: left; border-radius: 22px; overflow: hidden;
      background: rgba(255,255,255,.7); border: 1px solid var(--line);
      display: flex; flex-direction: column;
      transition: transform .22s, box-shadow .22s;
      position: relative;
    }
    .recipe-card:hover, .recipe-card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(12, 22, 16, .14);
    }
    .recipe-card .thumb {
      aspect-ratio: 4 / 3; overflow: hidden; background: #d7ddd7;
    }
    .recipe-card .thumb img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .55s ease;
    }
    .recipe-card:hover .thumb img { transform: scale(1.05); }
    .recipe-card .body { padding: 1rem 1.05rem 1.15rem; display: grid; gap: .4rem; flex: 1; }
    .recipe-card .cat-tag {
      font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
      color: var(--leaf); font-weight: 600;
    }
    .recipe-card h3 {
      font-family: var(--font-display); font-size: 1.28rem;
      margin: 0; line-height: 1.2; color: var(--brand);
    }
    .recipe-card .meta { margin-top: auto; font-size: .88rem; color: var(--muted); }
    .cart-btn {
      position: absolute; top: .75rem; right: .75rem; z-index: 2;
      width: 36px; height: 36px; border-radius: 50%;
      display: grid; place-items: center; color: var(--muted);
      background: rgba(255,255,255,.9); border: 1px solid rgba(255,255,255,.5);
      backdrop-filter: blur(6px);
    }
    .cart-btn svg { width: 18px; height: 18px; }
    .cart-btn.on {
      color: #fff; background: var(--brand); border-color: var(--brand);
    }

    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }

    .detail-back {
      display: inline-flex; align-items: center; gap: .4rem;
      margin: 1rem 0 1rem; color: var(--leaf); font-weight: 600;
    }
    .detail-hero {
      position: relative; border-radius: 28px; overflow: hidden;
      min-height: min(62dvh, 560px); color: #f7f4ee;
      margin-bottom: 1.5rem; box-shadow: var(--shadow);
      display: grid; align-items: end; isolation: isolate;
    }
    .detail-hero img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: -2; animation: ken 14s ease-out both;
    }
    .detail-hero::after {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(180deg, rgba(8,14,10,.05) 20%, rgba(8,14,10,.88) 100%);
    }
    .detail-hero .content { padding: clamp(1.3rem, 4vw, 2.4rem); max-width: 40rem; }
    .detail-hero .cat-tag {
      color: var(--gold-soft); letter-spacing: .12em; text-transform: uppercase;
      font-size: .75rem; font-weight: 600;
    }
    .detail-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2.1rem, 7vw, 3.5rem);
      margin: .4rem 0 .5rem; line-height: 1.05;
    }
    .detail-hero .from { opacity: .88; margin-bottom: 1rem; }
    .timing { display: flex; flex-wrap: wrap; gap: .5rem; }
    .timing span {
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px; padding: .35rem .75rem; font-size: .85rem;
    }
    .detail-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.15rem; }
    .detail-actions .btn {
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: #f7f4ee;
    }
    .detail-actions .btn-cook {
      background: var(--gold); color: #1a1608; border-color: var(--gold);
    }
    .detail-actions .btn-shop {
      background: rgba(255,255,255,.92); color: var(--brand); border-color: transparent;
    }

    /* Shop sheet */
    .sheet-backdrop {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(10, 16, 12, .55);
      backdrop-filter: blur(4px);
      display: grid; align-items: end; justify-items: center;
      padding: 1rem; padding-bottom: calc(1rem + var(--safe-b));
      animation: fadeUp .25s ease both;
    }
    .sheet {
      width: min(560px, 100%);
      max-height: min(88dvh, 760px);
      overflow: auto;
      background: #f7f5f0;
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 1.25rem 1.25rem 1.4rem;
    }
    .sheet-head {
      display: flex; align-items: start; justify-content: space-between; gap: 1rem;
      margin-bottom: 1rem;
    }
    .sheet-head h2 {
      font-family: var(--font-display); font-size: 1.45rem;
      margin: 0; color: var(--brand); line-height: 1.15;
    }
    .sheet-head p { margin: .3rem 0 0; color: var(--muted); font-size: .92rem; }
    .sheet-close {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--line); background: #fff; flex-shrink: 0;
      font-size: 1.2rem; line-height: 1;
    }
    .shop-list { list-style: none; padding: 0; margin: 0 0 1rem; display: grid; gap: .45rem; }
    .shop-list li {
      display: grid; grid-template-columns: 22px 1fr; gap: .65rem; align-items: start;
      padding: .7rem .8rem; background: #fff; border: 1px solid var(--line); border-radius: 14px;
    }
    .shop-list input { margin-top: .15rem; accent-color: var(--leaf); width: 16px; height: 16px; }
    .shop-list input:checked + label { text-decoration: line-through; color: var(--muted); }
    .shop-actions {
      display: flex; flex-wrap: wrap; gap: .55rem;
      margin: 0 0 1rem;
    }
    .shop-actions .btn {
      border: 1px solid var(--line); background: #fff; border-radius: 999px;
      padding: .7rem 1rem; font-weight: 600;
    }
    .shop-actions .btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    .shop-actions .btn-danger {
      background: transparent; color: var(--danger); border-color: rgba(154, 63, 47, 0.35);
    }
    .cart-recipes {
      list-style: none; padding: 0; margin: 0 0 .9rem; display: grid; gap: .3rem;
    }
    .cart-recipes li {
      display: flex; align-items: center; justify-content: space-between; gap: .5rem;
      padding: .35rem .55rem .35rem .65rem; background: #fff; border: 1px solid var(--line); border-radius: 10px;
    }
    .cart-recipes .cart-recipe-title {
      font-weight: 600; color: var(--brand); line-height: 1.2; font-size: .88rem;
    }
    .cart-recipes .cart-recipe-meta {
      display: inline; font-size: .75rem; color: var(--muted); font-weight: 500; margin-left: .35rem;
    }
    .cart-recipes .cart-recipe-meta::before { content: "· "; }
    .cart-recipes .remove-recipe {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      border: 1px solid var(--line); background: #f7f5f0; color: var(--muted);
      font-size: .95rem; line-height: 1;
    }
    .cart-section-label {
      font-size: .78rem; letter-spacing: .1em; text-transform: uppercase;
      font-weight: 700; color: var(--leaf); margin: 0 0 .55rem;
    }
    .cart-recipe-block { margin-bottom: 1.15rem; }
    .cart-recipe-block h3 {
      font-family: var(--font-display); font-size: 1.1rem;
      margin: 0 0 .55rem; color: var(--brand);
    }
    .cart-empty {
      text-align: center; padding: 1.75rem 1rem; color: var(--muted);
      background: rgba(255,255,255,.7); border: 1px dashed var(--line); border-radius: 16px;
      margin-bottom: 1rem;
    }

    /* Cook mode */
    .cook-mode {
      position: fixed; inset: 0; z-index: 90;
      background: #101812; color: #f4f1ea;
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      animation: fadeUp .3s ease both;
    }
    .cook-top {
      display: flex; align-items: center; justify-content: space-between; gap: .75rem;
      padding: .85rem 1rem; border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .cook-top h2 {
      font-family: var(--font-display); font-size: clamp(1.15rem, 4vw, 1.5rem);
      margin: 0; line-height: 1.15;
    }
    .cook-exit {
      border-radius: 999px; padding: .55rem .95rem;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16);
      font-weight: 600; white-space: nowrap;
    }
    .cook-tabs {
      display: flex; gap: .4rem; padding: .75rem 1rem 0;
    }
    .cook-tabs button {
      flex: 1; padding: .7rem; border-radius: 12px;
      background: rgba(255,255,255,.06); font-weight: 600; opacity: .7;
    }
    .cook-tabs button.active { opacity: 1; background: rgba(196, 163, 90, .22); color: var(--gold-soft); }
    .cook-body {
      flex: 1; overflow: auto; padding: 1rem 1.15rem 1.25rem;
      -webkit-overflow-scrolling: touch;
    }
    .cook-progress {
      font-size: .85rem; letter-spacing: .08em; text-transform: uppercase;
      color: rgba(244,241,234,.55); margin-bottom: .75rem;
    }
    .cook-step {
      font-size: clamp(1.35rem, 5.2vw, 2rem);
      line-height: 1.35; font-weight: 500;
      max-width: 28ch;
    }
    .cook-ings { list-style: none; padding: 0; margin: 0; display: grid; gap: .55rem; }
    .cook-ings li {
      display: grid; grid-template-columns: 28px 1fr; gap: .75rem; align-items: start;
      padding: .9rem 1rem; border-radius: 16px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
      font-size: clamp(1.05rem, 3.5vw, 1.25rem);
    }
    .cook-ings input { width: 20px; height: 20px; margin-top: .15rem; accent-color: var(--gold); }
    .cook-ings input:checked + label { opacity: .45; text-decoration: line-through; }
    .cook-nav {
      display: grid; grid-template-columns: 1fr 1fr; gap: .65rem;
      padding: .85rem 1rem calc(.85rem + var(--safe-b));
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .cook-nav button {
      padding: 1rem; border-radius: 16px; font-size: 1.05rem; font-weight: 700;
      background: rgba(255,255,255,.1);
    }
    .cook-nav .next {
      background: var(--gold); color: #1a1608;
    }
    .cook-nav button:disabled { opacity: .35; }
    body.cook-open .topbar,
    body.cook-open .bottom-nav { display: none !important; }
    body.cook-open main { visibility: hidden; }

    .fact {
      margin: 0 0 1.5rem; padding: 1.1rem 1.2rem;
      border-left: 3px solid var(--gold);
      background: rgba(255,255,255,.58); border-radius: 0 16px 16px 0; color: var(--ink-soft);
    }
    .fact strong {
      display: block; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--gold); margin-bottom: .35rem;
    }

    .detail-layout { display: grid; gap: 1.5rem; }
    @media (min-width: 820px) {
      .detail-layout { grid-template-columns: .95fr 1.15fr; align-items: start; }
    }
    .panel {
      background: rgba(255,255,255,.62); border: 1px solid var(--line);
      border-radius: 22px; padding: 1.25rem 1.3rem 1.4rem;
    }
    .panel h2 {
      font-family: var(--font-display); font-size: 1.35rem;
      margin: 0 0 .9rem; color: var(--brand);
    }
    .ingredients { list-style: none; padding: 0; margin: 0; display: grid; gap: .55rem; }
    .ingredients li {
      display: grid; grid-template-columns: 22px 1fr; gap: .55rem; align-items: start;
      padding-bottom: .55rem; border-bottom: 1px dashed var(--line);
    }
    .ingredients li:last-child { border-bottom: 0; padding-bottom: 0; }
    .ingredients input { margin-top: .2rem; accent-color: var(--leaf); width: 16px; height: 16px; }
    .ingredients input:checked + label { text-decoration: line-through; color: var(--muted); }
    .steps { margin: 0; padding-left: 1.2rem; display: grid; gap: .85rem; }
    .steps li::marker { color: var(--leaf); font-weight: 700; font-family: var(--font-display); }
    .note {
      margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line);
      color: var(--ink-soft); font-size: .95rem;
    }
    .note strong { color: var(--brand); }

    .bottom-nav {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: var(--safe-b); z-index: 50;
      display: flex; gap: .35rem; padding: .4rem;
      background: rgba(24, 48, 36, .93); color: #f7f4ee;

    const UNICODE_FRAC = { "¼": 0.25, "½": 0.5, "¾": 0.75, "⅓": 1 / 3, "⅔": 2 / 3, "⅛": 0.125, "⅜": 0.375, "⅝": 0.625, "⅞": 0.875 };

    function parseShopAmount(str) {
      if (!str) return null;
      const s = String(str).trim().replace(/,/g, "");
      const m = s.match(/^(\d+)?\s*([¼½¾⅓⅔⅛⅜⅝⅞])?(?:\/(\d+))?$/) || s.match(/^(\d+)\s+(\d+)\/(\d+)$/) || s.match(/^(\d+)\/(\d+)$/);
      if (s.match(/^(\d+)\s+(\d+)\/(\d+)$/)) {
        const [, w, a, b] = s.match(/^(\d+)\s+(\d+)\/(\d+)$/);
        return Number(w) + Number(a) / Number(b);
      }
      if (s.match(/^(\d+)\/(\d+)$/)) {
        const [, a, b] = s.match(/^(\d+)\/(\d+)$/);
        return Number(a) / Number(b);
      }
      const uni = s.match(/^(\d+)?([¼½¾⅓⅔⅛⅜⅝⅞])$/);
      if (uni) return (uni[1] ? Number(uni[1]) : 0) + UNICODE_FRAC[uni[2]];
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : null;
    }

    function formatShopAmount(n) {
      if (!Number.isFinite(n) || n <= 0) return "";
      const whole = Math.floor(n + 1e-9);
      const frac = n - whole;
      const fracs = [
        [0, ""], [0.125, "⅛"], [0.25, "¼"], [1 / 3, "⅓"], [0.375, "⅜"],
        [0.5, "½"], [0.625, "⅝"], [2 / 3, "⅔"], [0.75, "¾"], [0.875, "⅞"]
      ];
      let best = "";
      let bestDiff = 0.04;
      for (const [v, s] of fracs) {
        const d = Math.abs(frac - v);
        if (d < bestDiff) { bestDiff = d; best = s; }
      }
      if (!best && frac > 0.04) return String(Math.round(n * 100) / 100);
      if (whole === 0) return best || String(Math.round(n * 100) / 100);
      return best ? `${whole}${best}` : String(whole);
    }

    };

    function normalizePkgSize(raw) {
      if (!raw) return "";
      let s = String(raw).trim().toLowerCase()
        .replace(/\s+/g, " ")
        .replace(/\boz\b\.?/g, "ounce")
        .replace(/\blbs?\b\.?/g, "pound")
        .replace(/(\d)\s*-\s*(ounce|pound)/g, "$1-$2")
        .replace(/(\d+(?:\.\d+)?)\s+(ounce|pound)s?\b/g, "$1-$2")
        .replace(/ounces\b/g, "ounce")
        .replace(/pounds\b/g, "pound");
      // Keep only size-like parentheticals (skip "1 stick", "optional", etc.)
      if (!/\d/.test(s)) return "";
      if (/\bstick/.test(s)) return "";
      return s;
    }

    function parseIngredientForShop(raw) {
      let text = String(raw || "").trim();
      if (!text) return null;
      text = text.replace(/^(meat|meatballs|sauce|queso|guacamole|cake|icing|glaze|streusel):\s*/i, "");

      // Juice of ½ lemon
      const juice = text.match(/^juice of\s+([¼½¾⅓⅔⅛⅜⅝⅞\d./]+)\s+lemon/i);
      if (juice) {
        const q = parseShopAmount(juice[1]) || 1;
        return { qty: ceilShop(q), unit: "each", key: "lemon", label: "lemon", buyWhole: true, pkgSize: "" };
      }

      // Stick butter patterns: ½ cup (1 stick) butter / 2 tablespoons (¼ stick) butter
      const stickParen = text.match(/([¼½¾⅓⅔⅛⅜⅝⅞\d./]+)\s*(?:cup|cups|tablespoons?|tbsp)?\s*\(([¼½¾⅓⅔⅛⅜⅝⅞\d./]+)\s*sticks?\)\s*.*\b(butter|margarine)\b/i);
      if (stickParen) {
        const sticks = parseShopAmount(stickParen[2]) || 0;
        return { qty: sticks, unit: "stick", key: "butter", label: "butter", buyWhole: true, pkgSize: "" };
      }
      const stickLead = text.match(/^([¼½¾⅓⅔⅛⅜⅝⅞\d./]+)\s*sticks?\b.*\b(butter|margarine)\b/i);
      if (stickLead) {
        return { qty: parseShopAmount(stickLead[1]) || 1, unit: "stick", key: "butter", label: "butter", buyWhole: true, pkgSize: "" };
      }

      let qty = 1;
      let unit = "";
      let rest = text;
      let pkgSize = "";

      // Parenthetical package size: 6 (12-ounce) cans tomato paste
      const pkg = text.match(/^([¼½¾⅓⅔⅛⅜⅝⅞]|\d+[¼½¾⅓⅔⅛⅜⅝⅞]?|\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)\s*\(([^)]+)\)\s*(cans?|packages?|pkgs?|boxes?|bags?|bottles?|jars?|envelopes?)?\s*(.+)$/i);
      if (pkg) {
        qty = parseShopAmount(pkg[1]) || 1;
        pkgSize = normalizePkgSize(pkg[2]);
        unit = (pkg[3] || "").toLowerCase();
        rest = pkg[4].trim();
        // e.g. (3.9-ounce box) vanilla pudding — size embeds container word
        if (!unit && /\b(box|can|package|bag|bottle|jar)\b/i.test(pkg[2])) {
          const um = pkg[2].match(/\b(box|can|package|bag|bottle|jar)\b/i);
          if (um) unit = um[1].toLowerCase();
          pkgSize = normalizePkgSize(pkg[2].replace(/\b(box|can|package|bag|bottle|jar)\b/i, "").trim());
        }
      } else {
        const m = text.match(/^([¼½¾⅓⅔⅛⅜⅝⅞]|\d+[¼½¾⅓⅔⅛⅜⅝⅞]?|\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)\s*(cans?|packages?|pkgs?|boxes?|bags?|bottles?|jars?|envelopes?|sticks?|cloves?|slices?|strips?|stalks?|bunches?|loaves|loaf|pounds?|lbs?|ounces?|oz|cups?|tablespoons?|teaspoons?|quarts?|gallons?|pints?)?\s*(.+)$/i);
        if (!m) {
          const id = normalizeShopItem(text);
          if (!id) return null;
          return {
            qty: 1,
            unit: id.shopUnit,
            key: id.key,
            label: id.label,
            buyWhole: true,
            pkgSize: DEFAULT_PKG_SIZE[id.key] || ""
          };
        }
        qty = parseShopAmount(m[1]) || 1;
        unit = (m[2] || "").toLowerCase();
        rest = m[3].trim();
        // Size written after unit: 1 can (15-ounce) corn — uncommon; also "1 12-ounce can"
        const inline = rest.match(/^\(([^)]+)\)\s*(.+)$/);
        if (inline) {
          pkgSize = normalizePkgSize(inline[1]);
          rest = inline[2].trim();
        }
      }

      const id = normalizeShopItem(rest);
      if (!id) return null;

      // Convert butter volumes to sticks (1 stick = ½ cup = 8 tbsp = ¼ lb)
      if (id.key === "butter") {
        let sticks = qty;
        if (/^cups?$/.test(unit)) sticks = qty / 0.5;
        else if (/^tablespoons?$/.test(unit)) sticks = qty / 8;
        else if (/^teaspoons?$/.test(unit)) sticks = qty / 24;
        else if (/^pounds?$|^lbs?$/.test(unit)) sticks = qty * 4;
        else if (/^ounces?$|^oz$/.test(unit)) sticks = qty / 4;
        else if (/^sticks?$/.test(unit)) sticks = qty;
        else if (!unit) sticks = qty;
        return { qty: sticks, unit: "stick", key: "butter", label: "butter", buyWhole: true, pkgSize: "" };
      }

      if (id.key === "heavy whipping cream" && /^cups?$/.test(unit)) {
        return { qty: qty * 8, unit: "ounce", key: id.key, label: id.label, buyWhole: false, pkgSize: "" };
      }

      if (id.key === "eggs" || id.key === "egg yolks") {
        return { qty, unit: "each", key: id.key, label: id.label, buyWhole: true, pkgSize: "" };
      }

      const unitMap = {
        cans: "can", can: "can", packages: "package", package: "package", pkgs: "package", pkg: "package",
        boxes: "box", box: "box", bags: "bag", bag: "bag", bottles: "bottle", bottle: "bottle",
        jars: "jar", jar: "jar", envelopes: "envelope", envelope: "envelope",
        pounds: "pound", pound: "pound", lbs: "pound", lb: "pound",
        ounces: "ounce", ounce: "ounce", oz: "ounce",
        cups: "cup", cup: "cup", tablespoons: "tablespoon", tablespoon: "tablespoon",
        teaspoons: "teaspoon", teaspoon: "teaspoon",
        cloves: "clove", clove: "clove", slices: "slice", slice: "slice",
        strips: "strip", strip: "strip", stalks: "stalk", stalk: "stalk",
        bunches: "bunch", bunch: "bunch", loaf: "loaf", loaves: "loaf",
        sticks: "stick", stick: "stick", quarts: "quart", quart: "quart",
        gallons: "gallon", gallon: "gallon", pints: "pint", pint: "pint"
      };
      unit = unitMap[unit] || id.shopUnit || "each";

      if (!pkgSize) pkgSize = DEFAULT_PKG_SIZE[id.key] || "";

      const buyWhole = /^(can|package|box|bag|bottle|jar|envelope|each|clove|slice|strip|stalk|bunch|loaf|stick)$/.test(unit);
      return { qty, unit, key: id.key, label: id.label, buyWhole, pkgSize };
    }

    function formatShopLine(item) {
      let qty = item.qty;
      if (item.buyWhole) qty = ceilShop(qty);
      else if (item.unit === "pound" || item.unit === "ounce") qty = Math.round(qty * 100) / 100;
      else qty = Math.round(qty * 100) / 100;

      if (item.key === "butter") {
        const sticks = ceilShop(item.qty);
        return sticks === 1 ? "1 stick butter" : `${sticks} sticks butter`;
      }
      if (item.unit === "each") {
        const q = ceilShop(item.qty);
        return `${q} ${item.label}`;
      }
      const qStr = formatShopAmount(qty);
      const unit = qty === 1 ? item.unit : (
        item.unit === "loaf" ? "loaves" :
        item.unit === "bunch" ? "bunches" :
        item.unit === "box" ? "boxes" :
        item.unit.endsWith("s") ? item.unit : item.unit + "s"
      );
      // e.g. 6 (12-ounce) cans tomato paste
      if (item.pkgSize && /^(can|package|box|bag|bottle|jar|envelope)$/.test(item.unit)) {
        return `${qStr} (${item.pkgSize}) ${unit} ${item.label}`;
      }
      if (item.pkgSize && item.unit === "ounce") {
        return `${qStr} ounces ${item.label}`;
      }
      return `${qStr} ${unit} ${item.label}`;
    }

    /** Combined HEB-friendly grocery lines from all cart recipes (merged, no duplicates). */
    function buildHebShoppingList(recipes = cartRecipes()) {
      const map = new Map();
      for (const r of recipes) {
        for (const ing of r.ingredients || []) {
          const parsed = parseIngredientForShop(ing);
          if (!parsed) continue;
          const mapKey = `${parsed.key}||${parsed.unit}||${parsed.pkgSize || ""}`;
          const prev = map.get(mapKey);
          if (prev) {
            prev.qty += parsed.qty;
            if (!prev.pkgSize && parsed.pkgSize) prev.pkgSize = parsed.pkgSize;
          } else {
            map.set(mapKey, { ...parsed });
          }
        }
      }
      return [...map.values()]
        .map(formatShopLine)
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
    }

        return hay.includes(q);
      });

    function scrollRecipeToTop() {
      const jump = () => {
        window.scrollTo(0, 0);

        if (main) main.scrollTop = 0;
        const hero = document.querySelector("#view-recipe .detail-hero");
        if (hero) hero.scrollIntoView({ block: "start", behavior: "auto" });
      };
      jump();
      requestAnimationFrame(() => {
        jump();
        requestAnimationFrame(jump);
      });
      // Images can change layout after load — keep the hero in view
      const img = document.querySelector("#view-recipe .detail-hero img");
      if (img && !img.complete) {
        img.addEventListener("load", jump, { once: true });
      }
      setTimeout(jump, 50);
      setTimeout(jump, 200);
    }

              <ul class="cook-ings">
                ${r.ingredients.map((ing, i) => `
                  <li>
                    <input type="checkbox" id="cook-ing-${i}" />
                    <label for="cook-ing-${i}">${escapeHtml(ing)}</label>
                  </li>`).join("")}
              </ul>
            `}
          </div>
          ${state.cookTab === "steps" ? `
            <div class="cook-nav">
              <button type="button" data-cook-prev ${step === 0 ? "disabled" : ""}>Previous</button>
              <button class="next" type="button" data-cook-next>${step >= total - 1 ? "Done" : "Next step"}</button>
            </div>` : `
            <div class="cook-nav" style="grid-template-columns:1fr">
              <button class="next" type="button" data-cook-tab="steps">Back to steps</button>
            </div>`}
        </div>`;
    }

    function renderOverlays() {
      const host = $("#overlays");
      const r = RECIPES.find(x => x.id === state.recipeId);
      document.body.classList.toggle("cook-open", state.cookOpen);
      let html = "";
      if (state.cartOpen) html += renderCartSheet();
      if (state.cookOpen && r) html += renderCookMode(r);
      host.innerHTML = html;
      if (state.cookOpen && r) requestWakeLock();
      else releaseWakeLock();
    }

    function setView(view) {
      state.view = view;
      $$(".view").forEach(v => v.classList.toggle("active", v.id === `view-${view}`));
      $$(".bottom-nav button").forEach(b => {
        const nav = b.dataset.nav;
        const active =
          (nav === "home" && view === "home" && !state.cartOpen) ||
          (nav === "browse" && view === "browse" && !state.cartOpen) ||
          (nav === "cart" && state.cartOpen);
        b.classList.toggle("active", active);
      });
    }

    function render() {
      updateCartBadge();
      if (state.view === "home") renderHome();
      else if (state.view === "browse") renderBrowse();
      else if (state.view === "recipe") renderRecipe();
      setView(state.view);
      renderOverlays();
      bindDynamic();
    }

    function openRecipe(id) {
      state.recipeId = id;
      state.view = "recipe";
      state.cartOpen = false;
      state.cookOpen = false;
      state.cookStep = 0;
      state.cookTab = "steps";
      state.query = "";
      const search = $("#search");
      if (search) search.value = "";
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      render();
      history.pushState({ view: "recipe", id }, "", `#recipe/${id}`);
      scrollRecipeToTop();
    }

    function goHome() {
      state.view = "home";
      state.category = null;
      state.recipeId = null;
      state.cartOpen = false;
      state.cookOpen = false;
      history.pushState({ view: "home" }, "", "#");
      render();
    }

    function goBrowse(catId = null) {
      state.view = "browse";
      state.category = catId || null;
      state.recipeId = null;
      state.cartOpen = false;
      state.cookOpen = false;
      history.pushState({ view: "browse", category: state.category }, "", state.category ? `#browse/${state.category}` : "#browse");
      render();
    }

    function bindDynamic() {
      $$("[data-open]").forEach(el => {
        const open = () => openRecipe(el.dataset.open);
        el.addEventListener("click", open);
        el.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
        });
      });
      $$("[data-cart-toggle]").forEach(el => el.addEventListener("click", e => toggleCartRecipe(el.dataset.cartToggle, e)));
      $$("[data-cat]").forEach(el => el.addEventListener("click", () => goBrowse(el.dataset.cat || null)));
      $$("[data-nav]").forEach(el => el.addEventListener("click", () => {
        const nav = el.dataset.nav;
        if (nav === "home") {
          state.query = ""; $("#search").value = ""; goHome();
        } else if (nav === "browse") goBrowse(null);
        else if (nav === "cart") openCart();
      }));
      const back = $("[data-back]");
      if (back) back.addEventListener("click", () => {
        if (history.length > 1) history.back();
        else goBrowse(state.category);
      });

      $$("[data-add-cart]").forEach(el => el.addEventListener("click", () => {
        if (state.recipeId) state.cart.add(state.recipeId);
        saveCart();
        openCart();
      }));
      $$("[data-close-cart]").forEach(el => el.addEventListener("click", () => {
        state.cartOpen = false;
        render();
      }));
      $$("[data-cart-remove]").forEach(el => el.addEventListener("click", () => {
        removeFromCart(el.dataset.cartRemove);
      }));
      $$("[data-clear-cart]").forEach(el => el.addEventListener("click", () => {
        clearCart();
      }));
      $$("[data-copy-cart]").forEach(el => el.addEventListener("click", async () => {
        const recipes = cartRecipes();
        if (!recipes.length) return;
        const text = buildHebShoppingList(recipes).join("\n");
        try {
          await navigator.clipboard.writeText(text);
          el.textContent = "Copied!";
          setTimeout(() => { el.textContent = "Copy list"; }, 1500);
        } catch (_) {
          alert(text);
        }
      }));
      $$("[data-cook]").forEach(el => el.addEventListener("click", () => {
        state.cookOpen = true;
        state.cookTab = "steps";
        state.cookStep = 0;
        renderOverlays();
        bindDynamic();
      }));
      $$("[data-exit-cook]").forEach(el => el.addEventListener("click", () => {
        state.cookOpen = false;
        renderOverlays();
        bindDynamic();
      }));
      $$("[data-cook-tab]").forEach(el => el.addEventListener("click", () => {
        state.cookTab = el.dataset.cookTab;
        renderOverlays();
        bindDynamic();
      }));
      $$("[data-cook-prev]").forEach(el => el.addEventListener("click", () => {
        state.cookStep = Math.max(0, state.cookStep - 1);
        renderOverlays();
        bindDynamic();
      }));
      $$("[data-cook-next]").forEach(el => el.addEventListener("click", () => {
        const r = RECIPES.find(x => x.id === state.recipeId);
        if (!r) return;
        if (state.cookStep >= r.steps.length - 1) {
          state.cookOpen = false;
        } else {
          state.cookStep += 1;
        }
        renderOverlays();
        bindDynamic();
      }));
    }

    $("#search").addEventListener("input", e => {
      state.query = e.target.value;
      if (state.view === "recipe") state.view = state.category ? "browse" : "home";
      render();
    });
    $("#cartToggle").addEventListener("click", () => openCart());
    $("#brandHome").addEventListener("click", () => {
      state.query = ""; $("#search").value = ""; goHome();
    });
    window.addEventListener("scroll", () => {
      $("#topbar").classList.toggle("scrolled", window.scrollY > 8);
    }, { passive: true });
    window.addEventListener("popstate", () => routeFromHash());

    function routeFromHash() {
      const hash = location.hash.replace(/^#/, "");
      state.cartOpen = false;
      if (hash.startsWith("recipe/")) {
        state.recipeId = hash.slice(7); state.view = "recipe";
      } else if (hash.startsWith("browse/")) {
        state.category = hash.slice(7) || null; state.view = "browse";
      } else if (hash === "browse") {
        state.category = null; state.view = "browse";
      } else if (hash === "cart" || hash === "saved") {
        state.view = state.view === "recipe" ? "home" : (state.view || "home");
        state.cartOpen = true;
      } else {
        state.view = "home"; state.category = null;
      }
      render();
    }

    routeFromHash();

    // PWA install + service worker
    let deferredPrompt = null;
    const installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.add("show");
    });
    installBtn.addEventListener("click", async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.classList.remove("show");
        return;
      }
      // iOS / browsers without beforeinstallprompt
      const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      alert(isiOS
        ? "To install: tap Share, then “Add to Home Screen”."
        : "To install: open your browser menu and choose “Install app” or “Add to Home Screen”.");
    });
    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      installBtn.classList.remove("show");
    });
    // Show Install on iOS as guidance even without beforeinstallprompt
    if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone) {
      installBtn.classList.add("show");
    }
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
